<svg viewBox="0 0 1586 992" xmlns="http://www.w3.org/2000/svg" width="1586" height="992" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      /* Natural Eye Blinking - 2.5s cycle */
      .bot-eye {
        transform-box: fill-box;
        transform-origin: center center;
        animation: blinkEye 2.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes blinkEye {
        0%, 88%, 100% {
          transform: scaleY(1);
        }
        92%, 94% {
          transform: scaleY(0.06);
        }
      }
    </style>
  </defs>

