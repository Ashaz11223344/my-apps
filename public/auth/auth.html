<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Someone Trustworthy — Ashaz Apps</title>
  <meta name="description" content="Secure access gate — only for trusted users.">
  <link rel="icon" type="image/png" href="icon.png">

  <!-- Fonts: Raw Form Brutalist Poster System (Clash Display, Satoshi, JetBrains Mono) -->
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=satoshi@400,500,700,900&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" />

  <link rel="stylesheet" href="auth.css" />
</head>
<body>

  <!-- Animated Gradient Blobs (Raw Form System: #DB4A2B, #F8A348, #FF89A9 with multiply blend) -->
  <div class="ambient-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- Raw Form Brutalist Poster Container -->
  <div class="auth-container" id="authContainer">
    
    <!-- Meta Header Bar -->
    <div class="auth-meta-header">
      <div class="meta-tag">
        <span class="meta-dot"></span>
        <span class="meta-text">01 // RESTRICTED ACCESS</span>
      </div>
      <div class="meta-code">AUTH-GATE // 2026</div>
    </div>

    <!-- Lock Icon Badge -->
    <div class="lock-icon-box">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="0" ry="0"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        <circle cx="12" cy="16" r="1.5"/>
      </svg>
    </div>

    <!-- Title with massive typographic drama in Clash Display -->
    <h1 class="auth-title">
      FOR SOMEONE<br />
      <span class="highlight-text">TRUSTWORTHY.</span>
    </h1>

    <!-- Subtitle in Satoshi -->
    <p class="auth-subtitle">
      This private area is restricted to trusted users.<br />
      Enter your passcode to verify authorization.
    </p>

    <!-- Passcode Form -->
    <form id="authForm" style="width: 100%;">
      <!-- Passcode Input Section -->
      <div class="input-section">
        <div class="input-top-bar">
          <span class="input-label">PASSCODE // 4-DIGITS</span>
          <span class="input-status" id="inputStatus">[ENCRYPTED GATEWAY]</span>
        </div>
        <div class="input-wrapper" id="inputWrapper">
          <input
            type="password"
            maxlength="4"
            inputmode="numeric"
            id="passcode"
            placeholder="• • • •"
            autocomplete="off"
            required
          />
        </div>
      </div>

      <!-- Interactive CTA Button (from new-design.md) -->
      <button type="submit" id="verifyBtn" class="cta-button">
        <span class="btn-slide-bg"></span>
        <span class="btn-content">
          <span>VERIFY & ENTER</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </span>
      </button>
    </form>

    <!-- Secondary Ghost / Back Button -->
    <button id="backBtn" class="btn-ghost">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      <span>RETURN TO PORTFOLIO</span>
    </button>

    <!-- Status Message -->
    <p id="message" class="status-message"></p>

    <!-- Footer Meta on Card -->
    <div class="auth-card-footer">
      <span>SERVER: VERIFIED</span>
      <span>SYSTEM: GATEWAY-2026</span>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    document.getElementById('backBtn').addEventListener('click', () => {
      window.history.back();
    });
  </script>
</body>
</html>
